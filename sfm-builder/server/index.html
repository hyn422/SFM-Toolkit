<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SFM 可视化编程台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 3h7v7H3z"></path>
        <path d="M14 3h7v7h-7z"></path>
        <path d="M3 14h7v7H3z"></path>
        <path d="M14 14h7v7h-7z"></path>
        <path d="M9 9l6 6"></path>
        <path d="M15 9l-6 6"></path>
      </svg>
      <div>
        <strong>SFM 可视化编程台</strong>
        <span>Super Factory Manager</span>
      </div>
    </div>
    <div class="name-field">
      <label for="programName">程序名</label>
      <input id="programName" type="text" data-global-field="name" autocomplete="off" spellcheck="false">
    </div>
    <div class="top-actions">
      <button class="btn btn-ghost" data-action="open-import" title="粘贴已有 SFM 代码并识别">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        <span>导入代码</span>
      </button>
      <button class="btn btn-ghost" data-action="new-program" title="清空并新建">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        <span>新建</span>
      </button>
      <button class="btn btn-ghost" data-action="save-project" title="下载 .sfm 文件">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><path d="M17 21v-8H7v8"></path><path d="M7 3v5h8"></path></svg>
        <span>下载</span>
      </button>
      <button class="btn btn-primary" data-action="copy-code">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        <span>复制代码</span>
      </button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="panel">
        <div class="panel-title">
          <span>标签库</span>
          <button class="icon-btn" data-action="clear-labels" title="清空标签">×</button>
        </div>
        <div class="label-add-row">
          <input id="labelInput" type="text" placeholder="输入新标签" autocomplete="off" spellcheck="false">
          <button class="btn btn-ghost" data-action="add-label">添加</button>
        </div>
        <div id="labelBank" class="label-bank"></div>
        <p class="hint">标签先用标签枪标记方块，再在这里登记，语句里直接勾选即可。</p>
      </section>

      <section class="panel">
        <div class="panel-title"><span>快捷模板</span></div>
        <div class="snippet-list" id="snippetList"></div>
      </section>

      <section class="panel">
        <div class="panel-title"><span>示例程序</span></div>
        <div class="example-list" id="exampleList"></div>
      </section>

      <section class="panel data-panel">
        <div class="panel-title"><span>物品数据库</span></div>
        <div id="dbStatus" class="db-status">正在读取内置索引…</div>
        <button class="btn btn-ghost" data-action="load-db-file">选择 ATM10_ID_Database.json</button>
      </section>
    </aside>

    <section class="workspace">
      <div class="workspace-toolbar">
        <div>
          <h1>触发器与语句</h1>
          <p>按 SFM 语法拼装程序，右侧实时生成代码。</p>
        </div>
        <div class="toolbar-actions">
          <button class="btn btn-ghost" data-action="add-trigger-timer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            定时触发器
          </button>
          <button class="btn btn-ghost" data-action="add-trigger-pulse">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
            红石脉冲
          </button>
        </div>
      </div>
      <div id="triggerList" class="trigger-list"></div>
    </section>

    <aside class="preview-panel">
      <div class="preview-head">
        <div>
          <h2>生成代码</h2>
          <span id="codeMeta">0 字符</span>
        </div>
        <div class="preview-actions">
          <button class="icon-btn" data-action="paste-code" title="粘贴剪切板代码并识别">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><polyline points="8 12 11 15 16 10"></polyline></svg>
          </button>
          <button class="icon-btn" data-action="copy-code" title="复制代码">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
          <button class="icon-btn" data-action="download-code" title="下载 .sfm">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          </button>
        </div>
      </div>
      <pre class="code-block" id="codeOutput"><code>name "我的工厂"</code></pre>
      <div id="issues" class="issues"></div>
    </aside>
  </main>

  <div id="resourceModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="resourceModalTitle">
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal-panel">
      <div class="modal-head">
        <h3 id="resourceModalTitle">选择资源</h3>
        <button class="icon-btn" data-action="close-modal" title="关闭">×</button>
      </div>
      <input id="resourceSearch" type="search" placeholder="搜索物品 / 流体 / 化学品 ID 或中文名" autocomplete="off">
      <div id="resourceResults" class="resource-results"></div>
    </div>
  </div>

  <div id="importModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="importModalTitle">
    <div class="modal-backdrop" data-action="close-import-modal"></div>
    <div class="modal-panel import-panel">
      <div class="modal-head">
        <h3 id="importModalTitle">导入已有代码</h3>
        <button class="icon-btn" data-action="close-import-modal" title="??">?</button>
      </div>
      <textarea id="importCode" class="import-textarea" spellcheck="false" placeholder="name &quot;我的工厂&quot;&#10;every 20 ticks do&#10;    input from a&#10;    output to b&#10;end"></textarea>
      <div id="importFeedback" class="import-feedback"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-action="import-code-sample">填入示例</button>
        <button class="btn btn-primary" data-action="import-code">识别并导入</button>
      </div>
    </div>
  </div>

  <div id="regexModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="regexModalTitle">
    <div class="modal-backdrop" data-action="close-regex-modal"></div>
    <div class="modal-panel regex-panel">
      <div class="modal-head">
        <h3 id="regexModalTitle">编辑正则表达式</h3>
        <button class="icon-btn" data-action="close-regex-modal" title="关闭">×</button>
      </div>
      <div class="regex-body">
        <div class="field">
          <label>完整名称/正则</label>
          <input id="regexInput" type="text" placeholder="minecraft:stone / *\_ingot / (iron|gold)_block">
        </div>
        <p class="hint">支持 SFM 原生正则语法：<code>*</code> 匹配任意次，<code>+</code> 一次或多次，<code>(x|y)</code> 或，<code>.</code> 任意字符。例：<code>*_ingot</code> 匹配所有锭。</p>
        <div class="regex-actions">
          <button class="btn btn-primary" data-action="apply-regex">确认</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="pinyin-pro.js"></script>
  <script src="items-data.js"></script>
  <script src="app.js"></script>
  <script src="import-parser.js"></script>
</body>
</html>
